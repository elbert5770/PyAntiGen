[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]   # >=77: SPDX license expression
build-backend = "setuptools.build_meta"

[project]
name = "PyAntiGen"
# Version comes from the git tag via setuptools-scm; see [tool.setuptools_scm]
# below. Do not add a literal "version" here -- declaring both is a build error.
dynamic = ["version"]
description = "Declarative generation, simulation and identifiability analysis of compartmental Antimony/SBML models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# numpy 2.4 (the version the examples were run with) needs Python 3.11.
requires-python = ">=3.11"
authors = [
  { name = "Don Elbert", email = "elbert5770@gmail.com" }
]
keywords = ["systems biology", "antimony", "SBML", "tellurium", "pharmacokinetics", "alzheimer", "simulation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "tellurium",
  "scipy",
  "numpy",
  "pandas",
  "numdifftools",
  "openpyxl",
  "matplotlib",
  "pypesto",
  "SALib",     # Sobol sensitivity analysis (pyantigen.engine.Sensitivity_analysis)
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/elbert5770/PyAntiGen"
Repository = "https://github.com/elbert5770/PyAntiGen"
Issues = "https://github.com/elbert5770/PyAntiGen/issues"

[project.scripts]
pyantigen-create = "pyantigen.cli:create_project"

[tool.setuptools.packages.find]
include = ["pyantigen*"]

# Files that pyantigen-create copies out of the installed package.
[tool.setuptools.package-data]
pyantigen = [
  "template/Example/*.py",
  "template/Example/Modules/*.py",
  "template/Example/studies/*.py",
  "template/Example/studies/*.json",
  "template/Example/optimizations/*.py",
  "template/Example/optimizations/*.json",
  "template/data/*.csv",
  "template/data/*.py",
  "template/Example/*.md",
  "engine/*.md",
  ".agents/skills/*/*.md",
]

# Version is derived from the latest git tag (v1.0.10 -> 1.0.10; the leading "v"
# is stripped automatically). Releasing is therefore: commit, tag, build.
#
#   - On a clean checkout sitting exactly on a tag, the version IS that tag.
#   - On any other commit, or a dirty tree, you get a development version such
#     as 1.0.11.dev2+g1a2b3c4.d20260908. That carries a PEP 440 local segment,
#     which PyPI refuses to accept -- deliberately. It means an untagged or
#     uncommitted release fails at upload instead of shipping a wrong number.
#   - Building from an export with no .git falls back to the version below,
#     which is likewise unpublishable on purpose.
#
# CI must fetch full history and tags; a default shallow clone sees no tags.
[tool.setuptools_scm]
version_file = "pyantigen/_version.py"
fallback_version = "0.0.0+unknown"
