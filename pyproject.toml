[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyAntiGen"
version = "1.0.7"
description = "Short one-line description of what PyAntiGen does"
readme = "README.md"
license = { text = "MIT" }          # adjust if needed
requires-python = ">=3.9"
authors = [
  { name = "Don", email = "you@example.com" }
]
keywords = ["alzheimer", "immunology", "simulation"]   # tailor to your project
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "tellurium",
  "scipy",
  "numpy",
  "pandas",
  "numdifftools",
  "openpyxl",
  "matplotlib",
  "pypesto",
]

[project.urls]
Homepage = "https://github.com/you/PyAntiGen"

[project.scripts]
pyantigen-create = "framework.cli:create_project"

[tool.setuptools.packages.find]
include = ["framework*"]
