name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # triggers on any tag like v2.0.0

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build-and-publish:
    needs: test                # a failing test or build blocks the upload
    runs-on: ubuntu-latest
    environment: pypi          # the environment configured for PyPI trusted publishing
    permissions:
      id-token: write          # required for trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # setuptools-scm reads the version from the tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
