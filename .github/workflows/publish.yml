name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # triggers on any tag like v0.1.0, v1.2.3

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi          # matches the environment name from Step 1
    permissions:
      id-token: write          # required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
